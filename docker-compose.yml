# OrbStack:  HOST_PORT=7580 docker compose up --build -d   ->  http://127.0.0.1:7580
# The server binds 0.0.0.0 INSIDE the container (CIBA_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7580-7589.
name: ciba-hitl-lab

services:
  ciba-hitl-lab:
    restart: unless-stopped
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7580}:7580"
    environment:
      SHELF_URL: ${SHELF_URL:-}
      PORT: "7580"
      CIBA_BIND: 0.0.0.0
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-ciba-hitl-lab.local.ping-devops.com,local.ping-devops.com}
    env_file:
      - path: ${STANDALONE_ENV:-/Users/cmuir/Development/.env}
        required: false
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7580/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
